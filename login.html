<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 這裡貼上你剛剛在第二階段取得的 firebaseConfig
  const firebaseConfig = {
    apiKey: "AIzaSyBS_pK2aAl--i-lCsyD1GI2db8Vh2tSq-o",
    authDomain: "real-estate-system-edfba.firebaseapp.com",
    projectId: "real-estate-system-edfba",
    storageBucket: "real-estate-system-edfba.firebasestorage.app",
    messagingSenderId: "716449916436",
    appId: "1:716449916436:web:fd31006267cdd843386901"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // 登入成功，跳轉到主頁面
      window.location.href = "index.html"; 
    } catch (error) {
      alert("帳號或密碼錯誤！");
    }
  }
  window.handleLogin = handleLogin;
</script>

<div style="text-align:center; margin-top:100px;">
  <h2>請登入系統</h2>
  <input type="email" id="email" placeholder="信箱"><br><br>
  <input type="password" id="password" placeholder="密碼"><br><br>
  <button onclick="handleLogin()">登入</button>
</div>
